apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-paralegal-worker
  namespace: ai-paralegal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-paralegal-worker
  template:
    metadata:
      labels:
        app: ai-paralegal-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: ghcr.io/adamblansett/ai-paralegal-backend:latest
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: ai-paralegal-config
            - secretRef:
                name: ai-paralegal-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: storage-scratch
              mountPath: /data/storage
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: storage-scratch
          emptyDir: {}
