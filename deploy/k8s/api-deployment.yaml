apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-paralegal-api
  namespace: ai-paralegal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-paralegal-api
  template:
    metadata:
      labels:
        app: ai-paralegal-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/adamblansett/ai-paralegal-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-paralegal-config
            - secretRef:
                name: ai-paralegal-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: storage-scratch
              mountPath: /data/storage
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: storage-scratch
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ai-paralegal
spec:
  selector:
    app: ai-paralegal-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-paralegal-api-hpa
  namespace: ai-paralegal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-paralegal-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-paralegal-api-pdb
  namespace: ai-paralegal
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-paralegal-api
