apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-paralegal-config
  namespace: ai-paralegal
data:
  APP_ENV: "production"
  APP_NAME: "AI Paralegal"
  LOG_LEVEL: "INFO"
  TASK_EXECUTION_MODE: "celery"
  STORAGE_BACKEND: "s3"
  S3_SERVER_SIDE_ENCRYPTION: "aws:kms"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_BACKEND: "redis"
  EVENT_BUS_BACKEND: "redis"
  LLM_REDACT_PII_FOR_CLOUD: "true"
  LLM_BLOCK_PRIVILEGED_FOR_CLOUD: "true"
  AUTH_AUTO_SEED_DEMO_USERS: "false"
  CORS_ORIGINS: "https://paralegal.example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-paralegal-secrets
  namespace: ai-paralegal
type: Opaque
stringData:
  # Populate via ExternalSecrets / sealed-secrets / Vault / KMS in production:
  DATABASE_URL: "postgresql+asyncpg://paralegal:CHANGE_ME@postgres.ai-paralegal.svc:5432/ai_paralegal"
  REDIS_URL: "rediss://redis.ai-paralegal.svc:6379/0"
  CELERY_BROKER_URL: "rediss://redis.ai-paralegal.svc:6379/0"
  CELERY_RESULT_BACKEND: "rediss://redis.ai-paralegal.svc:6379/1"
  AUTH_SECRET_KEY: "REPLACE_WITH_KMS_OR_CSPRNG_64_BYTE_SECRET_KEY"
  S3_BUCKET: "ai-paralegal-prod-vault"
  S3_KMS_KEY_ID: "arn:aws:kms:us-east-1:000000000000:key/replace-me"
  GEMINI_API_KEY: ""
