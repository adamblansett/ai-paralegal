{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-paralegal.secretName" . }}
  labels:
    {{- include "ai-paralegal.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  CELERY_BROKER_URL: {{ .Values.secrets.celeryBrokerUrl | quote }}
  CELERY_RESULT_BACKEND: {{ .Values.secrets.celeryResultBackend | quote }}
  AUTH_SECRET_KEY: {{ .Values.secrets.authSecretKey | quote }}
  S3_BUCKET: {{ .Values.secrets.s3Bucket | quote }}
  S3_KMS_KEY_ID: {{ .Values.secrets.s3KmsKeyId | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
{{- end }}
