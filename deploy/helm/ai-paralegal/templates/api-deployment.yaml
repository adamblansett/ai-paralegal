apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-paralegal.fullname" . }}-api
  labels:
    {{- include "ai-paralegal.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "ai-paralegal.fullname" . }}-api
  template:
    metadata:
      labels:
        {{- include "ai-paralegal.labels" . | nindent 8 }}
        app: {{ include "ai-paralegal.fullname" . }}-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "ai-paralegal.fullname" . }}-config
            - secretRef:
                name: {{ include "ai-paralegal.secretName" . }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: storage-scratch
              mountPath: /data/storage
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: storage-scratch
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "ai-paralegal.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    app: {{ include "ai-paralegal.fullname" . }}-api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ai-paralegal.fullname" . }}-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ai-paralegal.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.api.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ai-paralegal.fullname" . }}-api-pdb
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      app: {{ include "ai-paralegal.fullname" . }}-api
{{- end }}
