services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-paralegal-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paralegal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paralegal}
      POSTGRES_DB: ${POSTGRES_DB:-ai_paralegal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paralegal} -d ${POSTGRES_DB:-ai_paralegal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-paralegal-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-paralegal-api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-paralegal}:${POSTGRES_PASSWORD:-paralegal}@postgres:5432/${POSTGRES_DB:-ai_paralegal}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TASK_EXECUTION_MODE: celery
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_DIR: /data/storage
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-mock}
      LLM_FALLBACK_PROVIDERS: ${LLM_FALLBACK_PROVIDERS:-ollama,gemini,mock}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama-3.1-8b-instruct}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DEFAULT_MODEL: ${GEMINI_DEFAULT_MODEL:-gemini-2.5-flash}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-insecure-secret-change-in-production-32bytes}
      AUTH_TOKEN_EXPIRE_MINUTES: ${AUTH_TOKEN_EXPIRE_MINUTES:-480}
      AUTH_REFRESH_TOKEN_EXPIRE_DAYS: ${AUTH_REFRESH_TOKEN_EXPIRE_DAYS:-14}
      AUTH_AUTO_SEED_DEMO_USERS: ${AUTH_AUTO_SEED_DEMO_USERS:-true}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      LLM_REDACT_PII_FOR_CLOUD: ${LLM_REDACT_PII_FOR_CLOUD:-true}
      LLM_BLOCK_PRIVILEGED_FOR_CLOUD: ${LLM_BLOCK_PRIVILEGED_FOR_CLOUD:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      OCR_BACKEND: ${OCR_BACKEND:-auto}
      OCR_MIN_CHARS_PER_PAGE: ${OCR_MIN_CHARS_PER_PAGE:-20}
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-paralegal-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-paralegal}:${POSTGRES_PASSWORD:-paralegal}@postgres:5432/${POSTGRES_DB:-ai_paralegal}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TASK_EXECUTION_MODE: celery
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_DIR: /data/storage
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-mock}
      LLM_FALLBACK_PROVIDERS: ${LLM_FALLBACK_PROVIDERS:-ollama,gemini,mock}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama-3.1-8b-instruct}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DEFAULT_MODEL: ${GEMINI_DEFAULT_MODEL:-gemini-2.5-flash}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-insecure-secret-change-in-production-32bytes}
      LLM_REDACT_PII_FOR_CLOUD: ${LLM_REDACT_PII_FOR_CLOUD:-true}
      LLM_BLOCK_PRIVILEGED_FOR_CLOUD: ${LLM_BLOCK_PRIVILEGED_FOR_CLOUD:-true}
      OCR_BACKEND: ${OCR_BACKEND:-auto}
      OCR_MIN_CHARS_PER_PAGE: ${OCR_MIN_CHARS_PER_PAGE:-20}
    volumes:
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-paralegal-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    container_name: ai-paralegal-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  storage_data:
  ollama_data:
